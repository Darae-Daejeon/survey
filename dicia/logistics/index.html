<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지역 물류산업 AX 수요조사 | 물류기업용</title>
<meta name="description" content="대전정보문화산업진흥원(DICIA) 지역 물류산업 AX 수요조사 — 물류기업용, 약 5분 소요">
<meta property="og:title" content="지역 물류산업 AX 수요조사 · 물류기업용">
<meta property="og:description" content="대전 물류 현장에 필요한 기술을 묻습니다. 약 5분 소요">
<meta property="og:type" content="website">
<meta name="theme-color" content="#07090d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307090d'/%3E%3Cpath d='M7 21l6-10 6 7 6-9' fill='none' stroke='%23ffb547' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ============ 시작 화면 ============ -->
<section id="intro" class="intro" aria-labelledby="introTitle">
  <canvas id="net" class="intro__net" aria-hidden="true"></canvas>
  <div class="intro__glow" aria-hidden="true"></div>
  <div class="intro__veil" aria-hidden="true"></div>

  <header class="intro__top">
    <img class="brand-ci" src="assets/img/dicia-ci-white.png" alt="대전정보문화산업진흥원 (DICIA)" width="311" height="34">
    <span class="chip chip--line" id="audienceChip"></span>
  </header>

  <div class="intro__body">
    <p class="eyebrow"><span class="dot" aria-hidden="true"></span>DAEJEON LOGISTICS · AX SURVEY 2026</p>
    <h1 id="introTitle" class="intro__title">대전 물류 현장에<br><em>필요한 기술</em>을 묻습니다</h1>
    <p class="intro__lead" id="introLead"></p>

    <ul class="intro__meta" aria-label="설문 개요">
      <li><strong id="metaMin"></strong><span>소요 시간</span></li>
      <li><strong id="metaQ"></strong><span>설문 문항</span></li>
      <li><strong>’27</strong><span>사업 기획 반영</span></li>
    </ul>

    <div class="intro__cta">
      <button type="button" class="btn btn--accent btn--xl" id="btnStart">
        설문 시작하기
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <button type="button" class="btn btn--ghost" id="btnResume" hidden>이어서 작성하기</button>
    </div>
  </div>

  <footer class="intro__foot">
    <dl>
      <div><dt>주관</dt><dd id="footHost"></dd></div>
      <div><dt>조사기관</dt><dd id="footAgency"></dd></div>
      <div><dt>문의</dt><dd><a id="footTel"></a><span class="sep">·</span><a id="footMail"></a></dd></div>
    </dl>
  </footer>
</section>

<!-- ============ 설문 화면 ============ -->
<section id="survey" class="survey" hidden>
  <header class="bar">
    <div class="bar__in">
      <button type="button" class="bar__home" id="btnHome" aria-label="처음 화면으로">
        <span class="bar__title" id="barTitle"></span>
      </button>
      <span class="bar__count" id="barCount" aria-live="polite"></span>
    </div>
    <ol class="steps" id="steps" aria-label="진행 단계"></ol>
  </header>

  <form id="form" class="survey__main" novalidate autocomplete="on">
    <div id="pages"></div>

    <nav class="pager">
      <button type="button" class="btn btn--ghost" id="btnPrev">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>이전
      </button>
      <p class="pager__err" id="formErr" role="alert"></p>
      <button type="button" class="btn btn--accent" id="btnNext">
        <span>다음</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </nav>
  </form>
</section>

<!-- ============ 완료 화면 ============ -->
<section id="done" class="done" hidden aria-live="polite">
  <canvas id="net2" class="intro__net" aria-hidden="true"></canvas>
  <div class="intro__veil" aria-hidden="true"></div>
  <div class="done__card">
    <svg class="done__check" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="29"/><path d="M19 33l9 9 17-19"/>
    </svg>
    <p class="eyebrow eyebrow--center">SUBMITTED</p>
    <h2 class="done__title">응답해 주셔서 감사합니다</h2>
    <p class="done__lead" id="doneLead"></p>
    <dl class="done__meta">
      <div><dt>접수번호</dt><dd id="doneNo">-</dd></div>
      <div><dt>접수일시</dt><dd id="doneAt">-</dd></div>
    </dl>
    <p class="done__mail" id="doneMail"></p>
    <p class="done__fine">문의 <a id="doneTel"></a> · <a id="doneEmail"></a></p>
  </div>
</section>

<!-- ============ 마감 화면 ============ -->
<section id="closed" class="done" hidden>
  <div class="done__card">
    <p class="eyebrow eyebrow--center">CLOSED</p>
    <h2 class="done__title">설문이 마감되었습니다</h2>
    <p class="done__lead">참여해 주셔서 감사합니다. 추가 문의는 아래 연락처로 부탁드립니다.</p>
    <p class="done__fine"><a id="closedTel"></a> · <a id="closedMail"></a></p>
  </div>
</section>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
